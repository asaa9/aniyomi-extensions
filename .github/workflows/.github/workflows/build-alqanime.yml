name: Build Alqanime APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Alqanime Debug APK
        env:
          CI: "false"
          CI_CHUNK_SIZE: "1"
          CI_CHUNK_NUM: "0"
        run: ./gradlew :src:id:alqanime:assembleDebug --stacktrace


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alqanime-APK
          path: src/id/alqanime/build/outputs/apk/debug/*.apk
