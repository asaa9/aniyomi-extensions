plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

ext {
    extName = 'Alqanime'
    extClass = '.Alqanime'
    extVersionCode = 1
}

apply from: "$rootDir/common.gradle"

configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.name == 'injekt-core') {
            details.useTarget("uy.kohesive.injekt:injekt-core:1.16.1")
        }
    }
}

tasks.matching { it.name.contains("lint") }.configureEach {
    enabled = false
}
